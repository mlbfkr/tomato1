name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Loyihani zipdan ochish
        run: unzip -o fokus-android.zip -d project
      - name: APK yig'ish
        working-directory: project
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fokus-taymer-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
      - name: Release sifatida chiqarish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Fokus Taymer v${{ github.run_number }}
          files: project/app/build/outputs/apk/debug/app-debug.apk
